# =====================================================================
# 事件（Adventure）本地化文件
# 文件名规则：Adventures{语言代码}.yaml
#   Adventures En.yaml → 英文
#   AdventuresCn.yaml  → 中文（如需添加请复制本文件并修改）
#
# Key 规则：使用 Logic 类名（非 Def 类名），即去掉末尾 "Def" 后的名称。
#   SampleCustomEventDef → Key: SampleCustomEvent
#
# sideloader 识别字段（Adventure 系统内置）：
#   Name        - 事件标题
#   HostName    - 主持人 NPC 的显示名称（HostId 为空时留空即可）
#
# 自定义扩展字段（由 AdventureEventLocalize.cs 读取，sideloader 会忽略）：
#   Description         - 事件触发时 IMGUI 界面显示的叙述文本
#   Options             - 选项按钮文本列表，支持占位符：
#                           {money}    → MoneyReward 值
#                           {healPct}  → HealPercent 值
#                           {cardCount}→ CardOfferCount 值
#   CardSelectDescription - 卡牌选择第二阶段的提示文本
# =====================================================================

SampleCustomEvent:
  Name: "神秘旅行者的礼物"
  HostName: ""
  Description: |-
    一位神秘的旅行者出现在你面前。
    「旅行者，我有些东西想送给你——请慎重选择。」
  Options:
    - "【金币】接受钱袋（获得 {money} 金币）"
    - "【治疗】喝下治愈药水（恢复最大 HP 的 {healPct}%）"
    - "【展品】收下神秘遗物（随机获得一件展品）"
    - "【卡牌】翻阅卡牌收藏（从 {cardCount} 张随机卡中选 1 张）"
  CardSelectDescription: "请从以下卡牌中选择一张加入牌库："
